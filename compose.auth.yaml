# Override: the WES checks a caller's bearer token against a trusted issuer
# (H5), here a fake one that hands a token to anyone. Use with:
#   docker compose -f compose.yaml -f compose.auth.yaml ...
services:
  fl-hub:
    environment:
      WES_OIDC_ISSUER: http://fake-idp:8080/oidc/
      WES_OIDC_AUDIENCE: fl-wes
    depends_on:
      fake-idp:
        condition: service_started

  auth-e2e-check:
    image: nvflare-testbed:local
    profiles: [test]
    command: ["python3", "/app/tests/auth_e2e_check.py"]
    environment:
      WES_URL: http://fl-hub:8080/ga4gh/wes/v1
      TOKEN_URL: http://fake-idp:8080/oidc/token
    depends_on:
      fl-hub:
        condition: service_healthy
    networks: [control]

  fake-idp:
    image: nvflare-testbed:local
    command: ["python3", "/app/tests/fake_idp.py"]
    depends_on:
      flare-image:
        condition: service_completed_successfully
    networks: [control]

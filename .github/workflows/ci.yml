# Everything that must pass on pull requests and pushes to `dev`. Only `push`
# needs secrets, and only runs on pushes to `dev`, so that pull requests from
# forks need none. No
# `paths:` filters, so that the gate always reports. The gate
# `passed` ("CI passed") is the only check to require; add every new job to
# its `needs`.
name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# The organization on Docker Hub can be changed with the repository variable
# `DOCKERHUB_ORG`, e.g., for a fork
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/nvflare-wes-testbed

# Only a new head commit of a pull request cancels its runs in progress
# (action `synchronize`, first attempt); runs for other actions and reruns
# wait, so that a run on the same commit never leaves a cancelled, failed
# `CI passed` (see "Cancelled runs" in `actions/gate/README.md` of
# `elixir-cloud-aai/.github`). Runs for pushes get their own group, so that
# none is dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.action == 'synchronize'
    && github.run_attempt == 1 }}

jobs:
  # ruff, gitleaks, actionlint and file checks, through pre-commit
  # (`.pre-commit-config.yaml`), as on commit
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install ".[lint]"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters and secret detection
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install ".[docs]"
      # Fails on warnings, e.g., of broken links and anchors
      - name: Build documentation
        run: mkdocs build --strict

  # The README's quick start, and the other tests that need no extra services
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit-test the checks from outside
        run: python3 tests/outside_check_test.py
      - name: Check that the image holds no site data or secrets
        run: tests/image-contents.sh
      - name: Build images
        run: docker compose --profile test build
      - name: Run the job in the simulator (T1)
        run: docker compose --profile test run --rm -T simulator
      - name: Run one WES run (T2)
        run: docker compose --profile test run --rm -T e2e
      - name: Check what tasks can reach (T3)
        run: |
          docker compose --profile test run --rm -T probe-site-1
          docker compose --profile test run --rm -T probe-site-2
      - name: Probe a node
        run: tests/probe-node.sh
      - name: Lose a site in the middle of a run (T6)
        run: tests/site-loss.sh
      - name: Run one WES run with public data URLs (T2)
        run: |
          docker compose --profile test down -v
          docker compose -f compose.yaml -f compose.public-data.yaml --profile test run --rm -T e2e
      - name: Run the hub for real sites, with its reverse proxy
        run: |
          docker compose --profile test down -v
          tests/hub.sh
      - name: Show logs
        if: failure()
        run: docker compose logs fl-hub funnel-site-1 funnel-site-2
      - name: Remove containers
        if: always()
        run: docker compose --profile test down -v

  # The chart of the hub on Rahti (`charts/nvflare-wes-hub`): lint, what it
  # exposes and refuses, and OpenShift's schemas. No cluster
  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Install kubeconform
        env:
          VERSION: v0.8.0
          SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSLo "${RUNNER_TEMP}/kubeconform.tar.gz" \
              "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${SHA256}  ${RUNNER_TEMP}/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "${RUNNER_TEMP}" kubeconform
      # mikefarah's yq is on GitHub's Ubuntu runners
      - name: Test chart
        run: KUBECONFORM="${RUNNER_TEMP}/kubeconform" tests/chart.sh

  # The image of the participants, which real nodes pull. A sandbox image, so
  # not signed or scanned (hack H20)
  push:
    name: Push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' }}
    needs: [docs, e2e]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=dev
            type=sha,format=long
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/Dockerfile.flare
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, docs, e2e, chart, push]
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          # `push` is skipped on pull requests only
          allow-skipped: ${{ github.event_name == 'pull_request' && 'push' || '' }}

# Release when a version tag (`vX.Y.Z`) is pushed: check the tag, the
# versions in `pyproject.toml` and `CITATION.cff`, the curated release notes
# (`docs/releases/<version>.md`), and that CI passed for its commit on `dev`
# (`prepare`); build and push the image of the participants
# (`images/Dockerfile.flare`, with SBOM and provenance attestations) by
# digest, untagged (`push`); scan exactly that digest for vulnerabilities in
# a job of its own, without the release credentials and signing identity
# (`scan`); and only then attest its build provenance, sign it (Sigstore
# keyless signing) and tag it with the version (`release-image`). Last,
# create the GitHub release with the curated notes followed by GitHub's
# generated notes (`publish`, shared action
# `elixir-cloud-aai/.github/actions/publish-release`), a pre-release until
# 1.0.0. Independently of `publish`, register the image at Pubgrade
# (`notify`), if it is configured (repository variable `PUBGRADE_URL`).
# `push` and `release-image` each need approval in the `release`
# environment (required reviewer, Docker Hub secrets `DOCKERHUB_LOGIN` and
# `DOCKERHUB_TOKEN`), and so does `notify` if Pubgrade is configured.
# Re-running all jobs builds, scans and signs a new digest, but stops
# before building if the version tag of the image exists (released images
# don't change); re-running failed jobs reuses the digest of the earlier
# attempt. `prepare` fails if a published release of the tag
# exists already. The image has no settings: they are passed when it
# starts. Nothing is tagged `latest`: CI tags `dev` and `sha-<commit>`. The
# Helm chart of the hub isn't released: it's installed from the repository.
# Release commits are on `dev`, the default branch. See "Releasing" in
# `docs/about/index.md`. Adapted from the release workflow of Krini.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), so that forks can publish to their own organization
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/nvflare-wes-testbed

# One run per tag, so that a run waiting for approval is not cancelled by
# the run of another tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to check that the release commit is on `dev`
          fetch-depth: 0
      # Guards against accidental releases, e.g., of unmerged commits; the
      # `release` environment's protection rules (required reviewer) are
      # what actually control publishing
      - name: Check release tag and commit
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "${TAG}" =~ ${pattern} ]]; then
            echo "::error::Tag '${TAG}' is not a release version (vX.Y.Z)"
            exit 1
          fi
          # Annotated, with a signature that GitHub verified
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
            echo "::error::Tag '${TAG}' is not annotated (git tag -s)"
            exit 1
          fi
          verified="$(gh api "repos/${REPOSITORY}/git/tags/$(git rev-parse "refs/tags/${TAG}")" \
            --jq .verification.verified)"
          if [[ "${verified}" != "true" ]]; then
            echo "::error::Tag '${TAG}' has no signature verified by GitHub (git tag -s)"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/dev; then
            echo "::error::Release commit is not on 'dev'"
            exit 1
          fi
          {
            echo "version=${TAG#v}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"
      # The version of the release is set in the release commit, so that
      # the sources, the citation metadata and the tag agree
      - name: Check versions in pyproject.toml and CITATION.cff
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          citation="$(yq -r .version CITATION.cff)"
          if [[ "${project}" != "${VERSION}" || "${citation}" != "${VERSION}" ]]; then
            echo "::error::Versions don't match the tag: pyproject.toml '${project}', CITATION.cff '${citation}', tag '${VERSION}'"
            exit 1
          fi
          if [[ -z "$(yq -r '.date-released // ""' CITATION.cff)" ]]; then
            echo "::error::No date-released in CITATION.cff"
            exit 1
          fi
      # The GitHub release (`publish`) starts with the curated notes of the
      # tagged commit, so they must exist and be in the organization's
      # format before anything is published; also checks that the tag
      # points to the release commit and that no published release of it
      # exists
      # Shared actions of elixir-cloud-aai/.github at v1.2.0, ahead of the
      # gate of ci.yml (v1.0.0), as `publish-release` needs it
      - name: Check release notes
        uses: elixir-cloud-aai/.github/actions/publish-release@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          notes: docs/releases/${{ steps.version.outputs.version }}.md
          commit: ${{ steps.version.outputs.sha }}
          check-only: "true"
      # The checks above don't run the tests: require a successful run of
      # the CI workflow for a push of the release commit to `dev`; runs for
      # pull requests test merge commits, not the commit itself. Re-runs
      # that succeeded count
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=dev&event=push&status=success&per_page=1" \
            --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
            echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${SHA} to dev; once CI passed for it, re-run this workflow"
            exit 1
          fi

  # Builds the image of the release commit once and pushes it by digest only
  # (untagged, with SBOM and provenance attestations), for `scan` to scan and
  # `release-image` to sign and tag. Digests of runs that fail (or fail the
  # scan) are never signed or tagged, but stay on Docker Hub, untagged
  push:
    name: Push release image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker Hub secrets (required reviewer)
    environment: release
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # The commit checked by `prepare`
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; `tags` only sets the
      # version label (the image is tagged by digest in `release-image`,
      # after the scan)
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Released images don't change: if the version tag exists (e.g. when
      # re-running all jobs of a release), stop before building
      - name: Check that the version isn't released yet
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The digest of the version tag, if it exists; errors other than
          # "not found" stop the run, so that it never passes by mistake
          status=0
          output="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
            --format '{{ json .Manifest }}' 2>&1)" || status=$?
          current=""
          if [[ "${status}" == 0 ]]; then
            current="$(jq -r .digest <<< "${output}")"
          elif ! grep -qiE 'not found|manifest unknown' <<< "${output}"; then
            echo "::error::Cannot check whether ${IMAGE_NAME}:${VERSION} exists: ${output}"
            exit 1
          fi
          if [[ -n "${current}" ]]; then
            echo "::error::${IMAGE_NAME}:${VERSION} exists already (${current}); release a new version instead"
            exit 1
          fi
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/Dockerfile.flare
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}

  # Scans exactly the pushed digest (public, so pulling it needs no login)
  # with Trivy (shared action `elixir-cloud-aai/.github/actions/scan-image`;
  # fails on fixable critical and high vulnerabilities). Kept apart from
  # `push`, `release-image` and `publish`, so that Trivy never runs next to
  # the Docker Hub credentials, the `contents: write` token and the signing
  # identity
  scan:
    name: Scan release image
    needs: [prepare, push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # For `.trivyignore.yaml`, if any, of the release commit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Check image digest
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.push.outputs.digest }}
          category: release
          upload: "false"

  # Attests the build provenance of the scanned digest, signs it, and tags
  # it with the version
  release-image:
    name: Release image
    needs: [prepare, push, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - name: Check image digest
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Released images don't change: a version tag of another digest stops
      # the run before this digest is attested and signed (the same digest,
      # e.g. when re-running failed jobs, is fine)
      - name: Check the version tag
        run: |
          status=0
          output="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
            --format '{{ json .Manifest }}' 2>&1)" || status=$?
          current=""
          if [[ "${status}" == 0 ]]; then
            current="$(jq -r .digest <<< "${output}")"
          elif ! grep -qiE 'not found|manifest unknown' <<< "${output}"; then
            echo "::error::Cannot check whether ${IMAGE_NAME}:${VERSION} exists: ${output}"
            exit 1
          fi
          if [[ -n "${current}" && "${current}" != "${DIGEST}" ]]; then
            echo "::error::${IMAGE_NAME}:${VERSION} already points to ${current}; release a new version instead"
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # The version tag points to the checked, scanned and signed digest
      - name: Tag image
        run: |
          tag="${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
          actual="$(docker buildx imagetools inspect "${tag}" \
            --format '{{ json .Manifest }}' | jq -r .digest)"
          if [[ "${actual}" != "${DIGEST}" ]]; then
            echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
            exit 1
          fi

  # Creates the GitHub release of the tag once the image is released: the
  # curated notes of the tagged commit (`docs/releases/<version>.md`), then
  # GitHub's generated notes under `## Commits`, with the
  # `**Full Changelog**` line last; a pre-release for versions below 1.0.0.
  # No environment: it needs no secrets, only `contents: write`. The tag must
  # still point to the release commit. Fails on a draft of the tag, and on a
  # published release unless an earlier attempt of this job created it
  # (then it passes without changes). One at a time, so that the latest
  # release is decided in order
  publish:
    name: Publish release
    needs: [prepare, release-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-publish-release
      cancel-in-progress: false
    permissions:
      contents: write # create the release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create release
        uses: elixir-cloud-aai/.github/actions/publish-release@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          notes: docs/releases/${{ needs.prepare.outputs.version }}.md
          commit: ${{ needs.prepare.outputs.sha }}

  # Registers the image at Pubgrade (publish mode, elixir-cloud-aai/Pubgrade#33)
  # with Pubgrade's action `actions/notify`, which notifies the subscribed
  # deployments, once the version tag of the image exists (`release-image`);
  # it doesn't wait for the GitHub release (`publish`). The action checks its
  # inputs, masks the token and retries only requests that never reached
  # Pubgrade (no connection), so that one run registers the build at most
  # once; a failed run says so, and re-running this job sends it again. The
  # token is a secret of the `release` environment, like the other release
  # credentials, so this job needs an approval there, too. The job only runs
  # if the variable `PUBGRADE_URL` is set for the repository: variables of an
  # environment aren't visible to a job's `if:` (it is evaluated before the
  # job enters the environment), and a check in a step would leave every
  # release without Pubgrade waiting for an approval that serves nothing. The
  # step fails if `PUBGRADE_REPOSITORY_ID` or `PUBGRADE_TOKEN` is missing or
  # invalid. See "Releasing" in `docs/about/index.md` for where to set them.
  notify:
    name: Notify Pubgrade
    needs: [prepare, release-image]
    if: vars.PUBGRADE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions: {}
    steps:
      - name: Notify Pubgrade
        uses: elixir-cloud-aai/Pubgrade/actions/notify@344a58adc1c871135f86c404eb33ed91011886ad # v0.3.0
        with:
          url: ${{ vars.PUBGRADE_URL }}
          repository-id: ${{ vars.PUBGRADE_REPOSITORY_ID }}
          token: ${{ secrets.PUBGRADE_TOKEN }}
          image: ${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/nvflare-wes-testbed:${{ needs.prepare.outputs.version }}
          git-tag: ${{ github.ref_name }}

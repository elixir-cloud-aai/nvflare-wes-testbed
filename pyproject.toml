[project]
name = "nvflare-wes-testbed"
version = "0.1.0"
description = "Sandbox: NVIDIA FLARE federated learning jobs through GA4GH WES and TES."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
# Hooks and their versions are in `.pre-commit-config.yaml`
lint = [
    "pre-commit>=4.6,<5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120

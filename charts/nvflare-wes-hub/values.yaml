# The hub on OpenShift (Rahti). Sandbox only. See "Rahti" in
# docs/setup/real-sites.md. Nothing here is specific to a deployment: set
# names and addresses with `--set`, and never commit them.

# The image of the hub, which also goes to the sites for their tasks
image:
  repository: docker.io/elixircloud/nvflare-wes-testbed
  # Required: a `sha-<commit>` tag of `dev`, as `dev` moves
  tag: ""
  pullPolicy: IfNotPresent

# Required: the public name of the hub (`FL_SERVER_NAME`), which goes into the
# startup kits. A name of your own, with an `A` record to the public address
# of the `LoadBalancer`: names under `rahtiapp.fi` lead to the routers instead
hubName: ""

# Required: the name of the Route that serves `/kits`, without a scheme. It
# leads to the routers, not to the hub's address, so it differs from
# `hubName`, and it ends in `.rahtiapp.fi`, which works out of the box,
# certificate included: the chart has none of its own. Links to kits use
# `https://<kitsHost>`
kitsHost: ""

# The FL port, on the `LoadBalancer` and in the pod: between 30000 and 35000
# on Rahti. The kits name it, so nodes must be let out on it (see the probe)
flPort: 30002

# `grpc`, or `http` (WebSocket): see T7 in the docs
flScheme: grpc

# Answer node probes on the FL port while no run is active, so that the probe
# needs no listener started by hand. The WES stops it before the FL server of
# a run starts, and starts it again after the run. `false` switches it off:
# then start a listener for a probe, as in the docs
probeResponder: true

# The internal address (`192.168.…`) of the project's pool for the
# `LoadBalancer`, which CSC translates to a public one: never the public
# address. Empty: MetalLB picks one of the pool's
loadBalancerIP: ""

# Required: the trusted OIDC issuer (e.g. LS Login's), https (H5). The WES
# refuses every run and most endpoints without one; see docs/testbed/shortcuts.md#h5
oidcIssuer: ""

# The aud a token must carry, matching this deployment's registration at the issuer
oidcAudience: fl-wes

# Signing algorithms accepted from the issuer, comma-separated
oidcAlgorithms: RS256

# Subjects allowed to use the WES, comma-separated; a static allow-list, not
# real access control (H22). Empty: any subject the issuer vouches for
oidcAllowedSubs: ""

# Entitlements, one of which a caller needs to start runs, comma-separated,
# each matched exactly, such as LS Login's group
# `urn:geant:lifescience-ri.eu:group:elixir:ECP_CLN:EOC-Compute#aai.lifescience-ri.eu`.
# The WES looks for them in the token's `oidcEntitlementClaim`, or, if the
# token has no such claim, at the issuer's userinfo endpoint (LS Login
# releases them only there). Reading runs stays with their owner. With
# `oidcAllowedSubs` too, both must hold. Empty: no entitlement needed
oidcRequiredEntitlements: ""

# The claim that carries the entitlements, with `oidcRequiredEntitlements`
oidcEntitlementClaim: eduperson_entitlement

# The Secret with the sites file under the key `sites.json` (see
# `compose/sites.example.json`). Not part of the chart: create it with `oc
# create secret`, and never commit it
sitesSecret: nvflare-wes-sites

# Optional: a Secret with token files for the TES of the sites, one key per
# file, mounted read-only at `/run/secrets/tes-tokens`, for `"token_file":
# "/run/secrets/tes-tokens/<key>"` in the sites file. Mounted as a whole, so
# that a token renewed in the Secret reaches the pod without a restart. Not
# part of the chart. Empty: none
tokenSecret: ""

# Optional: a Secret whose keys become environment variables of the hub: the
# client secrets and refresh tokens that `oauth` in the sites file names
# (`client_secret_env`, `refresh_token_env`). Not part of the chart. Empty: none
envSecret: ""

# The WES API in public: a Route for `/ga4gh/wes/v1` alone, on `kitsHost`, so
# that portals and clients reach it without `oc port-forward`. The WES checks
# every caller's token itself (`oidcIssuer`); nothing else of it is routed
wesRoute:
  enabled: false
  # With empty `oidcAllowedSubs` and `oidcRequiredEntitlements`, anyone the
  # issuer vouches for could start runs at the sites (H22): the chart refuses
  # that, unless this says so
  allowAnySubject: false

# Origins whose pages may call the WES API from a browser (CORS), such as
# `https://portal.example.org`, comma-separated: scheme, host and an optional
# port, no path, no wildcard. For `/ga4gh/wes/v1` only. Empty: none
corsAllowedOrigins: ""

# Optional: a TES gateway (proTES) that all tasks go through, pinned to the TES
# of their site (or its `backend` in the sites file). See "Through proTES" in
# docs/setup/real-sites.md. Empty `url`: tasks go straight to the TES of each
# site
tesGateway:
  # The gateway's URL, https, without `/ga4gh/tes/v1`
  url: ""
  # The gateway's token, from one of the two, never as a value: a key of
  # `tokenSecret` with a token file, or `oauth` with the keys of `oauth` in the
  # sites file, whose secrets come from `envSecret`
  tokenFile: ""
  oauth: {}

# The security context of the pod. No `runAsUser`: OpenShift picks an
# arbitrary one. `RuntimeDefault` suits most clusters, but Rahti's admission
# rejects it and sets a profile of its own when the pod names none: there, add
# `--set podSecurityContext.seccompProfile=null`
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# The security context of the container
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Limits at most 5 times the requests, as clusters with a LimitRange often
# refuse more (`maxLimitRequestRatio`). Change requests and limits together
resources:
  requests:
    cpu: 400m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

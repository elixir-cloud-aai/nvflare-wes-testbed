# The hub on OpenShift (Rahti). Sandbox only. See "Rahti" in
# docs/setup/real-sites.md. Nothing here is specific to a deployment: set
# names and addresses with `--set`, and never commit them.

# The image of the hub, which also goes to the sites for their tasks
image:
  repository: docker.io/elixircloud/nvflare-wes-testbed
  # Required: a `sha-<commit>` tag of `dev`, as `dev` moves
  tag: ""
  pullPolicy: IfNotPresent

# Required: the public name of the hub (`FL_SERVER_NAME`), which goes into the
# startup kits. A name of your own, with an `A` record to the public address
# of the `LoadBalancer`: names under `rahtiapp.fi` lead to the routers instead
hubName: ""

# Required: the name of the Route that serves `/kits`, without a scheme. It
# leads to the routers, not to the hub's address, so it differs from
# `hubName`, and it ends in `.rahtiapp.fi`, which works out of the box,
# certificate included: the chart has none of its own. Links to kits use
# `https://<kitsHost>`
kitsHost: ""

# The FL port, on the `LoadBalancer` and in the pod: between 30000 and 35000
# on Rahti. The kits name it, so nodes must be let out on it (see the probe)
flPort: 30002

# `grpc`, or `http` (WebSocket): see T7 in the docs
flScheme: grpc

# The internal address (`192.168.…`) of the project's pool for the
# `LoadBalancer`, which CSC translates to a public one: never the public
# address. Empty: MetalLB picks one of the pool's
loadBalancerIP: ""

# The Secret with the sites file under the key `sites.json` (see
# `compose/sites.example.json`). Not part of the chart: create it with `oc
# create secret`, and never commit it
sitesSecret: nvflare-wes-sites

# The security context of the pod. No `runAsUser`: OpenShift picks an
# arbitrary one. `RuntimeDefault` suits most clusters, but Rahti's admission
# rejects it and sets a profile of its own when the pod names none: there, add
# `--set podSecurityContext.seccompProfile=null`
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# The security context of the container
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

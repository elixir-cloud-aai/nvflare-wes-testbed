# Links to kits and to a site's certificate signing slot, which nodes fetch or
# post to with one-time tokens rather than a caller's identity (hacks H3, H4).
# The WES API only with `wesRoute.enabled` (`route-wes.yaml`); otherwise reach
# it with `oc port-forward`.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "hub.fullname" . }}-kits
  labels:
    {{- include "hub.labels" . | nindent 4 }}
spec:
  host: {{ .Values.kitsHost | quote }}
  path: /kits
  to:
    kind: Service
    name: {{ include "hub.fullname" . }}-wes
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "hub.fullname" . }}-csr
  labels:
    {{- include "hub.labels" . | nindent 4 }}
spec:
  host: {{ .Values.kitsHost | quote }}
  path: /sites
  to:
    kind: Service
    name: {{ include "hub.fullname" . }}-wes
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
